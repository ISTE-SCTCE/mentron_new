name: campus_app
description: Mentron+ student community.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0
dependencies:
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  supabase_flutter: 2.15.2
  flutter_secure_storage: 9.2.4
  url_launcher: 6.3.2
  qr_flutter: 4.1.0
  shared_preferences: 2.5.3
  animations: 2.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
