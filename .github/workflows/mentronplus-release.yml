name: Mentron+ release checks
on:
  push:
    paths: ['mentron-plus/**', '.github/workflows/mentronplus-release.yml']
  pull_request:
    paths: ['mentron-plus/**', '.github/workflows/mentronplus-release.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mentron-plus/web
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mentron-plus/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: npm audit --audit-level=high
